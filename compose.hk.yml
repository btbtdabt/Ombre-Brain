services:
  ombre-brain:
    build: .
    container_name: ombre-brain
    restart: unless-stopped
    env_file:
      - .env
    environment:
      OMBRE_SERVICE: brain
      OMBRE_TRANSPORT: streamable-http
      OMBRE_PORT: 8000
      OMBRE_BUCKETS_DIR: /data
      OMBRE_STATE_DIR: /state
      OMBRE_CONFIG_PATH: /app/config.yaml
      OMBRE_CODE_DIR: /state/_brain_app
      OMBRE_ENV_PATH: /state/.ombre-managed.env
      OMBRE_MANAGED_ENV_OVERRIDE: 1
      OMBRE_GATEWAY_ADMIN_URL: http://ombre-gateway:8010/api/config
    ports:
      - "18001:8000"
    volumes:
      - /srv/ombre-brain/buckets:/data
      - /srv/ombre-brain/state:/state
      - /srv/ombre-brain/config.yaml:/app/config.yaml

  ombre-gateway:
    build: .
    container_name: ombre-gateway
    restart: unless-stopped
    env_file:
      - .env
    environment:
      OMBRE_SERVICE: gateway
      OMBRE_PERSIST_CODE: 0
      OMBRE_TRANSPORT: streamable-http
      OMBRE_BUCKETS_DIR: /data
      OMBRE_STATE_DIR: /state
      OMBRE_CONFIG_PATH: /app/config.yaml
      OMBRE_ENV_PATH: /state/.ombre-managed.env
      OMBRE_MANAGED_ENV_OVERRIDE: 1
    ports:
      - "18002:8010"
    volumes:
      - /srv/ombre-brain/buckets:/data
      - /srv/ombre-brain/state:/state
      - /srv/ombre-brain/config.yaml:/app/config.yaml:ro
