name: Build & Push Docker Image

# 何时构建并推送镜像到 Docker Hub：
#   - 每次 push 到 main（忽略纯文档改动）→ 自动构建
#   - 配置 Docker Hub 凭据时推送 :latest + :<VERSION>；未配置时只做构建验证
#   - 也可在 Actions 页手动触发（Run workflow）
#
# 凭证只存在 GitHub 仓库 Secrets（绝不写进代码）：
#   DOCKERHUB_USERNAME = p0luz
#   DOCKERHUB_TOKEN    = Docker Hub Access Token（强烈建议用 token，不要用账号密码）
# 设置位置：仓库 → Settings → Secrets and variables → Actions → New repository secret

on:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - 'backup_*/**'
      - '.gitignore'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify hot-update manifest
        run: python deploy/gen_update_manifest.py --check

      - name: Read version from VERSION file
        id: ver
        run: echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Detect Docker Hub credentials
        id: registry
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Login to Docker Hub
        if: steps.registry.outputs.configured == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        if: steps.registry.outputs.configured == 'true'
        uses: docker/build-push-action@v6
        env:
          DOCKER_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/ombre-brain
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.DOCKER_IMAGE }}:latest
            ${{ env.DOCKER_IMAGE }}:${{ steps.ver.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build without publishing
        if: steps.registry.outputs.configured != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          platforms: linux/amd64
          tags: ombre-brain:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
